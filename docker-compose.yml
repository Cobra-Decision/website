services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobradecision-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ALTCHA_HMAC_SECRET=${ALTCHA_HMAC_SECRET}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - STORAGE_DIR=/app/public/uploads
      - ASSET_BASE_URL=/uploads
    volumes:
      # Persistent SQLite database file
      - ./app.sqlite:/app/app.sqlite
      # Persistent uploaded assets and materials
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
