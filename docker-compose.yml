services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobradecision-website
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_PATH=/app/data/app.sqlite
      - JWT_SECRET=${JWT_SECRET}
      - ALTCHA_HMAC_SECRET=${ALTCHA_HMAC_SECRET}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - STORAGE_DIR=/app/public/uploads
      - ASSET_BASE_URL=/uploads
      - LOG_DIR=/app/log
      - BACKUP_LOCAL_DIR=/app/backups
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - MEET_REMINDER_DAYS_BEFORE=${MEET_REMINDER_DAYS_BEFORE:-1}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    volumes:
      # Persistent SQLite database directory (WAL creates .sqlite-shm and .sqlite-wal)
      - ./data:/app/data
      # Persistent uploaded assets and materials
      - ./public/uploads:/app/public/uploads
      # Persistent log directory
      - ./log:/app/log
      # Persistent backup directory
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
